name: Nexus Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Windows Installer bauen
        run: npm run build -- --publish never

      - name: Installer als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Windows-Installer
          path: dist/*
          if-no-files-found: error
